name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read

# Let an active deployment finish before starting the latest queued run.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      # Keep required checks aligned with ci.yml; ESLint is not configured.
      - name: Unit tests (non-watch)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v5
